<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla ice cream card</title>
  </head>
  <body>
    <main>
      <article>
        <figure>
          <img src="" alt="" />
        </figure>

        <h1>Vanilla ice cream</h1>

        <ul>
          <li>Vegan</li>
          <li>Glutan free</li>
          <li>Organic</li>
        </ul>

        <p>Lorem ipsum dolor sit amet consectetur.</p>

        <div>
          <h2>Toppings</h2>
          <ul>
            <li>Choco chips</li>
            <li>Nuts</li>
          </ul>
        </div>

        <section>
          <div>
            <h2>$10.00</h2>
            <p>+$2 delivery</p>
          </div>

          <button>Add to cart</button>
        </section>
      </article>
    </main>
  </body>
</html>
